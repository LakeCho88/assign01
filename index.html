<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="함수와 반복문으로 배우는 아주 간단한 소수 판별 앱." />
    <title>소수 판별 연습</title>

    <style>
      :root {
        --navy: #003d7c;
        --maroon: #8f1d3f;
        --ink: #202a36;
        --paper: #f4f6f8;
        --line: #d8dee6;
      }

      * { box-sizing: border-box; }

      body {
        display: grid;
        min-height: 100vh;
        place-items: center;
        margin: 0;
        padding: 1.5rem;
        background: linear-gradient(135deg, #eef2f6, #ffffff 48%, #f2e8ed);
        color: var(--ink);
        font-family: Georgia, "Times New Roman", serif;
      }

      main {
        width: min(100%, 40rem);
        padding: clamp(2rem, 6vw, 4rem);
        background: #ffffff;
        border-top: 8px solid var(--maroon);
        box-shadow: 0 1.25rem 3rem rgb(0 61 124 / 12%);
      }

      h1 {
        margin: 0;
        color: var(--navy);
        font-size: clamp(2rem, 8vw, 3.5rem);
        line-height: 1.1;
      }

      .subtitle {
        margin: 0.75rem 0 2rem;
        color: #5a6572;
        font-family: Arial, sans-serif;
        line-height: 1.6;
      }

      form {
        display: flex;
        gap: 0.75rem;
        margin-bottom: 1.5rem;
      }

      label {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
      }

      input, button {
        min-height: 3rem;
        border: 1px solid var(--line);
        font: 1rem Arial, sans-serif;
      }

      input {
        width: 100%;
        padding: 0.75rem 1rem;
      }

      button {
        padding: 0.75rem 1.25rem;
        background: var(--navy);
        color: #ffffff;
        cursor: pointer;
        font-weight: 700;
      }

      button:hover { background: var(--maroon); }

      #result {
        min-height: 4.5rem;
        padding: 1rem;
        background: var(--paper);
        border-left: 5px solid var(--maroon);
        font-family: Arial, sans-serif;
        line-height: 1.6;
      }

      .hint {
        margin: 1rem 0 0;
        color: #657181;
        font: 0.875rem Arial, sans-serif;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>소수 판별 연습</h1>
      <p class="subtitle">숫자를 입력하면 함수와 반복문으로 소수인지 확인합니다.</p>
      <form id="prime-form">
        <label for="number-input">판별할 숫자</label>
        <input id="number-input" type="number" min="0" step="1" placeholder="예: 17" required />
        <button type="submit">판별하기</button>
      </form>
      <p id="result" aria-live="polite">숫자를 입력하고 버튼을 눌러 보세요.</p>
      <p class="hint">0 이상의 정수만 입력할 수 있어요.</p>
    </main>

    <script>
      // 입력한 수의 약수를 반복해서 확인하는 함수입니다.
      function checkPrime(number) {
        if (number < 2) {
          return false;
        }

        for (let divisor = 2; divisor < number; divisor += 1) {
          if (number % divisor === 0) {
            return false;
          }
        }

        return true;
      }

      function showResult(event) {
        event.preventDefault();
        const input = document.querySelector("#number-input");
        const result = document.querySelector("#result");
        const number = Number(input.value);

        if (!Number.isInteger(number) || number < 0) {
          result.textContent = "0 이상의 정수를 입력해 주세요.";
        } else if (checkPrime(number)) {
          result.textContent = number + "은(는) 소수입니다.";
        } else {
          result.textContent = number + "은(는) 소수가 아닙니다.";
        }
      }

      document.querySelector("#prime-form").addEventListener("submit", showResult);
    </script>
  </body>
</html>
